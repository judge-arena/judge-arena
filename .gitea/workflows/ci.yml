# ─── Judge Arena — Gitea Actions CI (Task 17, 1b plan) ─────────────────────
#
# This is the CANONICAL CI pipeline once the repo lands on Gitea (Phase 2 of
# the 1b plan migrates the repo itself — this file is authored ahead of
# that migration). .github/workflows/ci.yml is demoted to a lint/build-only
# mirror-status check; GitHub is a mirror, Gitea is canonical, per the
# repo-shape decision.
#
# RAW SHELL ONLY — no `uses: actions/*` steps anywhere below. The homelab's
# Gitea Actions runner (act_runner, host mode — see homelab-setup's
# apps/internal/gitea-runner/) cannot execute JavaScript actions at all;
# every step here is a plain `run:` shell block, matching every other
# first-party repo's .gitea/workflows/*.yaml in this homelab (job-ops,
# homeview, personal-feed).
#
# ═══════════════════════════════════════════════════════════════════════
# TWO THINGS THIS WORKFLOW HONESTLY CANNOT PROVE TODAY (documented, not
# hidden — see the report for Task 17):
#
#   1. This repo is not yet hosted on Gitea (Phase 2 does that migration),
#      so this file has never actually been *run* by the runner. The
#      checkout step's SSH URL (ssh://git@10.10.0.211/trij/judge-arena.git)
#      assumes the same org/path convention as every sibling repo
#      (job-ops, homeview, personal-feed) — confirm/adjust at migration
#      time if the actual path differs.
#
#   2. The homelab's Gitea runner (checked at authoring time against
#      homelab-setup's apps/internal/gitea-runner/{deployment.yaml,image/
#      Containerfile}) runs in HOST MODE: `container: { privileged: false,
#      network: "", valid_volumes: [] }`, no Docker socket, unprivileged.
#      There is no Docker/Podman/Buildah binary in that runner image at
#      all (confirmed: the image is Alpine 3.20 + bash/git/curl/jq/
#      kubectl/gettext/homelab-cli only). That means the `services:` block
#      below — which is correct, standard Gitea/GitHub Actions YAML for
#      the postgres/redis/rabbitmq sidecars this pipeline needs — CANNOT
#      actually start on the runner as currently provisioned; Docker-based
#      `services:` require a Docker-mode runner, and `docker compose up`
#      (used by the docker/scale-validation step) requires a container
#      engine binary that doesn't exist on this image either. Real OCI
#      builds in this homelab instead spawn ephemeral kaniko Jobs in the
#      cluster via `kubectl create -n tenant-builds -f -` (see job-ops's
#      and homeview's build-push workflows) — the same pattern the
#      `docker` job below stubs out for Harbor push.
#
#      Until either (a) a Docker-mode runner group is provisioned for
#      DB-backed CI, or (b) the postgres/redis/rabbitmq services are
#      instead spawned as ephemeral k8s Pods via kubectl (mirroring the
#      kaniko-build pattern), this workflow's `services:`-dependent jobs
#      are ASPIRATIONAL — authored to spec, not proven to execute on the
#      current runner fleet. This is a Phase-2/runner-infra prerequisite,
#      tracked alongside the repo's own Gitea migration.
#
#   `scripts/ci-local.sh` runs this exact shell sequence against the
#   already-running local podman services (postgres/redis/rabbitmq on
#   localhost) and IS what "CI green" means until both gaps above close.
# ═══════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-judge-arena-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.1'
  # judge_arena/password/localhost:5432 matches .env.test exactly — same
  # values scripts/ci-local.sh sources locally, so a failure reproduces
  # identically in both places.
  DATABASE_URL: postgresql://judge_arena:password@localhost:5432/judge_arena_test
  TEST_DATABASE_URL: postgresql://judge_arena:password@localhost:5432/judge_arena_test
  V1_DATABASE_URL: postgresql://judge_arena:password@localhost:5432/judge_arena_v1
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  NEXTAUTH_SECRET: test-secret-minimum-16-chars
  NEXTAUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: test-encryption-key-at-least-16-chars-long
  AUTHENTIK_ISSUER: https://authentik.test.local/application/o/judge-arena-test/

jobs:
  ci:
    runs-on: ubuntu-latest

    # ─── Service sidecars (see the header comment — aspirational on the
    # current host-mode runner until it's upgraded to Docker mode). Written
    # as standard Gitea/GitHub Actions `services:` so it's ready to go the
    # moment that prerequisite lands; ports match .env.test's assumed
    # localhost ports exactly.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judge_arena
          POSTGRES_PASSWORD: password
          POSTGRES_DB: judge_arena_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────────
      # actions/checkout@v4 is a JS action — unusable on this runner. Every
      # sibling repo's .gitea/workflows/*.yaml (job-ops, homeview,
      # personal-feed) does a plain SSH clone with the homelab-bot deploy
      # key instead; HTTPS checkout against this Gitea instance 401s (see
      # those workflows' own comments). Mirrored verbatim here.
      - name: Checkout source via SSH
        env:
          BOT_KEY: ${{ secrets.HOMELAB_BOT_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$BOT_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa 10.10.0.211 >> ~/.ssh/known_hosts 2>/dev/null
          # ASSUMPTION (see header comment #1): same org/path convention as
          # sibling repos. Confirm at Phase-2 migration time.
          git clone --no-checkout ssh://git@10.10.0.211/trij/judge-arena.git .
          git fetch origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      # ─── 2. Setup: Node 22 + npm ci ───────────────────────────────────
      - name: Setup Node ${{ env.NODE_VERSION }}
        run: |
          set -euo pipefail
          if command -v node >/dev/null 2>&1 && node -v | grep -q "^v${NODE_VERSION%%.*}\."; then
            echo "node $(node -v) already on the runner image — skipping install"
          else
            # The runner image (homelab-setup's apps/internal/gitea-runner/
            # image/Containerfile) is Alpine 3.20 with NO Node.js baked in,
            # and Alpine 3.20's own apk repos don't carry Node 22 yet
            # (engines.node in package.json requires >=22). Official
            # nodejs.org builds are glibc-only and won't run on Alpine/musl.
            # unofficial-builds.nodejs.org publishes a statically-linked
            # musl build that runs unmodified on BOTH musl and glibc hosts
            # (verified at authoring time: extracted and ran on a glibc
            # dev box too) — use that instead of apk/nvm so this step is
            # correct regardless of the runner image's libc.
            case "$(uname -m)" in
              x86_64) NODE_ARCH=x64 ;;
              aarch64) NODE_ARCH=arm64 ;;
              *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
            esac
            NODE_DIST="node-v${NODE_VERSION}-linux-${NODE_ARCH}-musl"
            curl -fsSL -o /tmp/node.tar.xz \
              "https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/${NODE_DIST}.tar.xz"
            # $HOME/.local, not /usr/local — the runner's rootfs is
            # read-only at runtime (readOnlyRootFilesystem: true).
            mkdir -p "$HOME/.local/node"
            tar -xJf /tmp/node.tar.xz -C "$HOME/.local/node" --strip-components=1
            echo "$HOME/.local/node/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/node/bin:$PATH"
          fi
          node -v
          npm -v

      - name: npm ci
        run: npm ci

      # v2 client already lands via package.json's `postinstall` (`npx
      # prisma generate`, no --schema flag). The v1-importer's independent
      # `@prisma/v1-client` (custom `output` in prisma/v1/schema.v1.prisma)
      # does NOT — it's a separate, manual generate. Without this step,
      # `tsc --noEmit` below fails outright: scripts/importer/{context,
      # artifacts,runs}.ts and tests/importer/helpers.ts all import
      # '@prisma/v1-client' directly (verified at authoring time: removing
      # the generated client reproduces `TS2307: Cannot find module
      # '@prisma/v1-client'` in exactly those files).
      - name: Generate v1 (importer) Prisma client
        run: npm run db:generate:v1

      # ─── 3. Lint + typecheck ──────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # ─── 5. Migrations — production mechanism, then the v1 scratch DB ─
      # `prisma migrate deploy` (NOT `db push`) against the service
      # Postgres — this is the exact command docker-compose.yml's `migrate`
      # one-shot service runs in production (Task 16), so this step proves
      # the real migration chain applies cleanly to a bare database.
      - name: Prisma migrate deploy (v2 schema — production mechanism)
        run: npx prisma migrate deploy

      # scripts/importer/**'s DB-backed tests (tests/importer/*.db.test.ts,
      # part of the 281-test `test:db` suite) need a second, independent
      # database seeded with the FROZEN v1 schema (prisma/v1/schema.v1.prisma)
      # — this is explicitly NOT touched by `prisma migrate reset` (which
      # only knows about DATABASE_URL/the v2 schema), so it needs its own
      # step. `prisma db push` against a URL whose database doesn't exist
      # yet auto-creates it (verified at authoring time against a freshly
      # dropped database) — no separate `CREATE DATABASE` step needed, and
      # it's idempotent (`already in sync`) on repeat runs.
      - name: Seed v1 scratch DB (importer DB tests)
        run: npm run db:push:v1

      # ─── 6. Tests: unit -> db -> integration ──────────────────────────
      # Unit run also gates the coverage thresholds in vitest.config.ts
      # (Task 17's coverage-gate requirement) — `test:coverage`, not plain
      # `test`, so a real regression fails this step. Same for `test:db`
      # via `test:db:coverage` (vitest.db.config.ts's own thresholds).
      # `test:integration` stays plain — see CONTRIBUTING.md's "Test
      # coverage" section for why that suite isn't coverage-gated.
      - name: Unit tests (+ coverage gate)
        run: npm run test:coverage

      - name: DB tests (+ coverage gate)
        run: npm run test:db:coverage

      - name: Integration tests
        run: npm run test:integration

      # ─── 7. Build ──────────────────────────────────────────────────────
      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: build-time-placeholder-secret-16
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

      # ─── 8. Docker image + Harbor push (STUBBED — Phase 2) ────────────
      # Real OCI builds in this homelab spawn an ephemeral kaniko Job in
      # tenant-builds via `kubectl create -f -` (see job-ops's and
      # homeview's build-push.yaml + homelab-setup's templates/
      # gitea-workflows/build-job.yaml.tmpl) — never `docker build` inline
      # on the runner (no Docker binary/socket there at all; the k8s Job
      # pattern is *why* buildah/docker never got baked into the runner
      # image). Wiring judge-arena into that pattern (Harbor project,
      # robot-account secret, the SSH-templated Job spawn + `kubectl wait`,
      # and the eventual `homelab onboard`/promote-PR loop) is explicitly
      # Phase 2 scope per the 1b plan, not this task.
      - name: "TODO(Phase 2): build + push image via kaniko"
        run: |
          set -euo pipefail
          TAG="sha-$(git rev-parse --short=12 HEAD)"
          # TODO(Phase 2): replace this block with the real kaniko spawn,
          # mirroring job-ops/homeview's "Spawn kaniko build Job" step:
          #   1. Clone homelab-setup for templates/gitea-workflows/build-job.yaml.tmpl
          #   2. envsubst COMPONENT=judge-arena SUBDIR=. TAG="$TAG" \
          #        REPO_SSH_URL=ssh://git@10.10.0.211/trij/judge-arena.git \
          #        COMMIT_SHA="${{ github.sha }}" < build-job.yaml.tmpl \
          #        | kubectl create -n tenant-builds -f - -o name
          #   3. Poll for Job completion (see job-ops's heartbeat loop —
          #      Gitea's actions.ZOMBIE_TASK_TIMEOUT kills silent waits)
          # Registry/tag placeholders for Phase 2 to wire up for real:
          echo "TODO(Phase 2): would push harbor.cluster.asethi.com/homelab/judge-arena:${TAG}"
          echo "TODO(Phase 2): would push harbor.cluster.asethi.com/homelab/judge-arena:latest"
          echo "TODO(Phase 2): homelab onboard CLI supplies the actual Harbor project + robot creds + promote-PR wiring — see project_cluster_cli_direction memory."

      # ─── docker/scale-validation (Task 16's S4 exit gate) ─────────────
      # `docker compose up --scale app=2 --scale worker=2` + an LB smoke
      # check is exactly what SHOULD run here in a fully-wired CI (build
      # the image from step 8's tag, scale it up via docker-compose.yml,
      # curl the nginx LB, confirm 2 distinct app replicas answer). It does
      # NOT run in this stubbed form: the runner has no Docker/Podman
      # binary at all (see header comment #2), so `docker compose` cannot
      # execute here regardless of the Harbor-push stub above. This is a
      # Phase-2 TODO, gated on the SAME runner-capability prerequisite
      # (Docker-mode runner, or moving this validation into the kaniko-Job
      # pattern instead) — Task 16 already proved this scale-up works via
      # local podman (see that task's report); this step's job is only to
      # re-prove it in CI once CI itself can run containers.
      - name: "TODO(Phase 2): docker compose scale-validation (app=2, worker=2)"
        run: |
          set -euo pipefail
          echo "TODO(Phase 2): not executed — runner has no container engine (see workflow header)."
          echo "Intended sequence once a Docker-mode runner/build path exists:"
          cat <<'EOF'
            docker compose up -d --scale app=2 --scale worker=2
            # wait for nginx + both app replicas healthy, then:
            for i in 1 2 3 4 5 6; do
              curl -fsS http://localhost/api/health && break
              sleep 5
            done
            # confirm round-robin actually reaches 2 distinct replicas
            # (e.g. an X-Replica-Id/hostname response header, or grep
            # nginx access logs for >1 distinct upstream addr).
          EOF
