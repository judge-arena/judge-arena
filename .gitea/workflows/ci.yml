# ─── Judge Arena — Gitea Actions CI (Task 17, 1b plan) ─────────────────────
#
# This is the CANONICAL CI pipeline once the repo lands on Gitea (Phase 2 of
# the 1b plan migrates the repo itself — this file is authored ahead of
# that migration). .github/workflows/ci.yml is demoted to a lint/build-only
# mirror-status check; GitHub is a mirror, Gitea is canonical, per the
# repo-shape decision.
#
# RAW SHELL ONLY — no `uses: actions/*` steps anywhere below. The homelab's
# Gitea Actions runner (act_runner, host mode — see homelab-setup's
# apps/internal/gitea-runner/) cannot execute JavaScript actions at all;
# every step here is a plain `run:` shell block, matching every other
# first-party repo's .gitea/workflows/*.yaml in this homelab (job-ops,
# homeview, personal-feed).
#
# ═══════════════════════════════════════════════════════════════════════
# WHAT THIS PIPELINE PROVES, AND WHAT IT DOES NOT (2026-08-11, Stage 3)
#
# RUNS FOR REAL on every push/PR: lint, `tsc --noEmit`, the unit suite with
# its coverage gate, and `next build`. On a push to main it then builds and
# pushes the OCI image via an ephemeral kaniko Job in tenant-builds.
#
# ALSO RUNS FOR REAL, since 2026-08-12 (Stage 6): the DB suite — run as
# `test:db:coverage`, so vitest.db.config.ts's per-glob thresholds gate too,
# and including the 5 seed guards — and the integration suite, in the
# `db-tests` job below.
# They need postgres/redis/rabbitmq, and this runner is act_runner
# in HOST MODE with no container engine of any kind, so a Docker `services:`
# block still cannot start anything here — the block that used to sit in this
# file was deleted rather than left decorative, because YAML that cannot
# execute reads to every future maintainer as coverage that exists.
#
# What replaced it: ONE ephemeral k8s Job in tenant-builds whose pod carries
# postgres/redis/rabbitmq as NATIVE SIDECARS (initContainers with
# `restartPolicy: Always`) alongside the Node test container. Containers in a
# pod share a network namespace, so `localhost:5432` works exactly as
# `services:` intended — and .env.test, which already points at localhost, is
# the single source of connection strings both locally and in CI.
#
# `restartPolicy: Always` is the load-bearing detail, not a formality. A Job
# pod only reaches Complete once every entry under `containers:` terminates;
# postgres never exits, so listing the services there would hang every run to
# activeDeadlineSeconds and report DeadlineExceeded whether or not the tests
# passed. Native sidecars (GA in k8s 1.33; this cluster is v1.34.3) are
# excluded from that check. See homelab-setup
# templates/gitea-workflows/db-test-job.yaml.tmpl for the full rationale.
#
# HISTORY WORTH KNOWING — this workflow spent its whole life failing at
# `Setup Node` and therefore ran NOTHING. The runner image had no libstdc++,
# so the musl Node binary this file downloads died at exec with relocation
# errors. Fixed 2026-08-11 in homelab-setup (runner image 0.4.1-kubectl-5);
# written up as divergence entry 61. The lesson is baked into the unit-test
# step below as an explicit "the suite actually ran" assertion: a red setup
# step and a red test step look identical in the run list but mean opposite
# things about coverage, and only one of them is a flake.
#
#   `scripts/ci-local.sh` runs the full sequence INCLUDING the DB and
#   integration suites against local podman services, and remains the fastest
#   way to exercise those two locally. It and the `db-tests` job below source
#   the SAME .env.test, so a failure reproduces identically in both places.
# ═══════════════════════════════════════════════════════════════════════

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual re-run. Earned its place on day one: a runner pod replaced
  # mid-task (rolling the runner StatefulSet, 2026-08-11) leaves the run
  # wedged in `running` until Gitea's ZOMBIE_TASK_TIMEOUT, and this Gitea
  # exposes no rerun/cancel API endpoint — /actions/runs/{id}/rerun and
  # .../cancel both 404. Without this trigger the only way to retry is to
  # push another commit, which launders CI infrastructure problems into the
  # source history.
  #
  # USE IT FROM THE GITEA WEB UI. The dispatch REST endpoint
  # (POST /actions/workflows/{file}/dispatches) also 404s on this version, so
  # this cannot be driven from a script or from an agent — verified
  # 2026-08-11, after the trigger was added, by trying exactly that. The
  # button works; the API does not.
  #
  # And the cause is worth avoiding rather than retrying: rolling the runners
  # is never free, because a pod may be mid-task. Editing the runner's
  # deployment.yaml — including things that LOOK like comments but sit inside
  # the `args:` heredoc — rolls them. See homelab-setup divergence entry 63.
  workflow_dispatch:

concurrency:
  group: ci-judge-arena-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.23.1'
  # V8 sizes its default old-space heap to ~half the cgroup limit, so on the
  # runner's former 1Gi limit `tsc --noEmit` got ~512Mi and died at 508Mi with
  # "Reached heap limit ... JavaScript heap out of memory" (2026-08-11). The
  # runner limit is now 4Gi (homelab-setup apps/internal/gitea-runner); this
  # states the heap explicitly rather than inheriting a heuristic that moves
  # whenever that limit is retuned.
  #
  # Keep this comfortably BELOW the container limit. Asking V8 for more heap
  # than the cgroup permits does not buy headroom — it just trades a clean V8
  # abort for an OOMKill, which surfaces as a killed step with no JS error and
  # is markedly harder to read.
  NODE_OPTIONS: '--max-old-space-size=3072'
  # judge_arena/password/localhost:5432 matches .env.test exactly — same
  # values scripts/ci-local.sh sources locally, so a failure reproduces
  # identically in both places.
  DATABASE_URL: postgresql://judge_arena:password@localhost:5432/judge_arena_test
  TEST_DATABASE_URL: postgresql://judge_arena:password@localhost:5432/judge_arena_test
  V1_DATABASE_URL: postgresql://judge_arena:password@localhost:5432/judge_arena_v1
  REDIS_URL: redis://localhost:6379
  RABBITMQ_URL: amqp://guest:guest@localhost:5672
  NEXTAUTH_SECRET: test-secret-minimum-16-chars
  NEXTAUTH_URL: http://localhost:3000
  ENCRYPTION_KEY: test-encryption-key-at-least-16-chars-long
  AUTHENTIK_ISSUER: https://authentik.test.local/application/o/judge-arena-test/

jobs:
  ci:
    runs-on: ubuntu-latest

    # No `services:` block — deliberately. See the header: this runner has no
    # container engine, so sidecars cannot start, and leaving the YAML in
    # place made the pipeline look DB-covered when it was not.

    steps:
      # ─── 1. Checkout ──────────────────────────────────────────────────
      # actions/checkout@v4 is a JS action — unusable on this runner. Every
      # sibling repo's .gitea/workflows/*.yaml (job-ops, homeview,
      # personal-feed) does a plain SSH clone with the homelab-bot deploy
      # key instead; HTTPS checkout against this Gitea instance 401s (see
      # those workflows' own comments). Mirrored verbatim here.
      - name: Checkout source via SSH
        env:
          BOT_KEY: ${{ secrets.HOMELAB_BOT_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$BOT_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa 10.10.0.211 >> ~/.ssh/known_hosts 2>/dev/null
          # ASSUMPTION (see header comment #1): same org/path convention as
          # sibling repos. Confirm at Phase-2 migration time.
          git clone --no-checkout ssh://git@10.10.0.211/trij/judge-arena.git .
          git fetch origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      # ─── 2. Setup: Node 22 + npm ci ───────────────────────────────────
      - name: Setup Node ${{ env.NODE_VERSION }}
        run: |
          set -euo pipefail
          if command -v node >/dev/null 2>&1 && node -v | grep -q "^v${NODE_VERSION%%.*}\."; then
            echo "node $(node -v) already on the runner image — skipping install"
          else
            # The runner image (homelab-setup's apps/internal/gitea-runner/
            # image/Containerfile) is Alpine 3.20 with NO Node.js baked in,
            # and Alpine 3.20's own apk repos don't carry Node 22 yet
            # (engines.node in package.json requires >=22). Official
            # nodejs.org builds are glibc-only and won't run on Alpine/musl.
            # unofficial-builds.nodejs.org publishes a statically-linked
            # musl build that runs unmodified on BOTH musl and glibc hosts
            # (verified at authoring time: extracted and ran on a glibc
            # dev box too) — use that instead of apk/nvm so this step is
            # correct regardless of the runner image's libc.
            case "$(uname -m)" in
              x86_64) NODE_ARCH=x64 ;;
              aarch64) NODE_ARCH=arm64 ;;
              *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
            esac
            NODE_DIST="node-v${NODE_VERSION}-linux-${NODE_ARCH}-musl"
            curl -fsSL -o /tmp/node.tar.xz \
              "https://unofficial-builds.nodejs.org/download/release/v${NODE_VERSION}/${NODE_DIST}.tar.xz"
            # $HOME/.local, not /usr/local — the runner's rootfs is
            # read-only at runtime (readOnlyRootFilesystem: true).
            mkdir -p "$HOME/.local/node"
            tar -xJf /tmp/node.tar.xz -C "$HOME/.local/node" --strip-components=1
            echo "$HOME/.local/node/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/node/bin:$PATH"
          fi
          node -v
          npm -v

      - name: npm ci
        run: npm ci

      # v2 client already lands via package.json's `postinstall` (`npx
      # prisma generate`, no --schema flag). The v1-importer's independent
      # `@prisma/v1-client` (custom `output` in prisma/v1/schema.v1.prisma)
      # does NOT — it's a separate, manual generate. Without this step,
      # `tsc --noEmit` below fails outright: scripts/importer/{context,
      # artifacts,runs}.ts and tests/importer/helpers.ts all import
      # '@prisma/v1-client' directly (verified at authoring time: removing
      # the generated client reproduces `TS2307: Cannot find module
      # '@prisma/v1-client'` in exactly those files).
      - name: Generate v1 (importer) Prisma client
        run: npm run db:generate:v1

      # ─── 3. Lint + typecheck ──────────────────────────────────────────
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # ─── 5. Tests ─────────────────────────────────────────────────────
      # Unit run also gates the coverage thresholds in vitest.config.ts
      # (Task 17's coverage-gate requirement) — `test:coverage`, not plain
      # `test`, so a real regression fails this step.
      #
      # The tee + assertion is the durable half of divergence entry 61. This
      # workflow previously died at `Setup Node` on every single run, which
      # rendered in the run list as one red step and was easy to read as a
      # flaky download — while the actual consequence was that NOTHING ran.
      # What this floor does and does NOT guard, stated precisely because the
      # earlier wording here claimed more than is true. `passWithNoTests` is
      # not set in any of the three configs and defaults to FALSE, so a run
      # matching zero files exits 1 on its own — verified against the pinned
      # vitest 3.2.4, not assumed. The uncovered case is NARROWING: a config
      # or glob edit that drops 20 of 26 files still exits 0 and still reads
      # green. That is what the count catches. The floor sits well below the
      # current total (367 at time of writing) so ordinary churn does not
      # trip it; it polices collapse, not the exact count.
      - name: Unit tests (+ coverage gate)
        run: |
          set -euo pipefail
          npm run test:coverage 2>&1 | tee /tmp/unit.raw
          # vitest colourises its summary, so ESC sequences sit between
          # "Tests" and the count and a naive grep matches nothing — which
          # would fail this assertion on a perfectly green suite and wedge CI
          # permanently. Strip them first. printf-built ESC rather than a
          # \x1b escape because the runner's sed is busybox, not GNU.
          ESC=$(printf '\033')
          sed "s/${ESC}\[[0-9;]*m//g" /tmp/unit.raw > /tmp/unit.log
          passed=$(grep -oE 'Tests[[:space:]]+[0-9]+ passed' /tmp/unit.log \
                   | grep -oE '[0-9]+' | tail -1 || true)
          echo "vitest reported passed=${passed:-<none>}"
          if [ -z "${passed:-}" ] || [ "$passed" -lt 300 ]; then
            echo "::error::unit suite did not actually run (parsed '${passed:-<none>}', floor 300)."
            echo "A pipeline that executes zero tests must fail LOUDLY — see divergence entry 61."
            exit 1
          fi

      # ─── 6. DB + integration suites — run in the `db-tests` job below ──
      # They need postgres/redis/rabbitmq, which cannot be started from a
      # `run:` step on a host-mode runner. They are not skipped: `db-tests`
      # spawns an ephemeral k8s Job with native service sidecars, and
      # `build-push` gates on it, so no image is published whose DB suite is
      # red. Kept as a pointer rather than deleted, because "where did the DB
      # tests go" is the first question a reader of this file will have.

      # ─── 7. Build ──────────────────────────────────────────────────────
      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: build-time-placeholder-secret-16
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

  # ─── DB + integration suites, in an ephemeral Job with service sidecars ─
  # Roadmap A is ~24 days of work whose correctness lives almost entirely in
  # the database layer, so this is the suite that matters most and it is the
  # one that never ran. Unit tests + typecheck stay green while a uniqueness
  # constraint or an aggregation window is wrong.
  #
  # Separate job, not a step in `ci`: it holds no npm/Node state (everything
  # happens inside the spawned pod), it needs its own SSH setup, and keeping
  # it separate is what lets `build-push` depend on BOTH.
  #
  # Runs on pull_request too — a PR is exactly when a broken constraint
  # should be caught, and unlike `build-push` this publishes nothing.
  db-tests:
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Setup SSH (homelab-bot)
        env:
          BOT_KEY: ${{ secrets.HOMELAB_BOT_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_KEY:-}" ]; then
            echo "::error::HOMELAB_BOT_SSH_KEY is empty. It is an owner-level Gitea secret;"
            echo "the spawned Job also needs homelab-bot to be a READ COLLABORATOR on this repo."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$BOT_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa 10.10.0.211 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Clone homelab-setup (for the db-test-job template)
        run: |
          set -euo pipefail
          rm -rf /tmp/homelab
          git clone --depth 1 ssh://git@10.10.0.211/trij/homelab.git /tmp/homelab

      - name: Spawn the DB-test Job
        env:
          COMPONENT: judge-arena
          REPO_SSH_URL: ssh://git@10.10.0.211/trij/judge-arena.git
          COMMIT_SHA: ${{ github.sha }}
          IMAGE: docker.io/library/node:22-alpine
          # `test:db:coverage`, not `test:db`. vitest.db.config.ts carries
          # per-glob thresholds derived from measured actuals — auth-guard.ts
          # at 86/91/80/86 and scripts/importer/** at 96/98/87/96 — and until
          # now nothing in CI ran them, so they were documentation rather than
          # a gate. This is the only run in which auth-guard.ts and
          # scripts/importer/** execute at all (the DB-free unit run shows
          # them near-0%), which makes it the only place those thresholds can
          # be enforced. The coverage-db/ report itself is discarded with the
          # pod; the gate is the point, not the artifact.
          TEST_CMD: npm run test:db:coverage && npm run test:integration
        run: |
          set -euo pipefail
          # The variable list is MANDATORY. Bare `envsubst` would also expand
          # the $DATABASE_URL / $TEST_DATABASE_URL / $V1_DATABASE_URL set at
          # job level above (baking them into the YAML and turning the
          # template's runtime safety guard into a constant), and would
          # replace the template's `$url` loop variable — unset here — with
          # the empty string, which makes that guard reject every run.
          job=$(envsubst '$COMPONENT $REPO_SSH_URL $COMMIT_SHA $IMAGE $TEST_CMD' \
            < /tmp/homelab/templates/gitea-workflows/db-test-job.yaml.tmpl \
            | kubectl create -n tenant-builds -f - -o name)
          echo "JOB=$job" >> "$GITHUB_ENV"
          echo "spawned $job"

      - name: Wait for the DB-test Job
        run: |
          set -euo pipefail
          # Heartbeat rather than `kubectl wait`, for the same reason as the
          # build job: a silent wait longer than Gitea's ZOMBIE_TASK_TIMEOUT
          # (default 10m) gets the task killed server-side while the runner
          # keeps going. Printing every 30s keeps it alive.
          #
          # 25m cap sits below the template's activeDeadlineSeconds=1800 (30m)
          # so a genuinely wedged suite hits ITS OWN deadline and leaves the
          # pod for forensics (ttlSecondsAfterFinished=3600).
          deadline=$(( $(date -u +%s) + 1500 ))
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            complete=$(kubectl get -n tenant-builds "$JOB" \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get -n tenant-builds "$JOB" \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            if [ "$complete" = "True" ]; then
              echo "[$(date -u +%H:%M:%S)] $JOB Complete"
              # Surface the suite output on success too — the whole point of
              # this job is the coverage claim, so the counts belong in the
              # log rather than only in a green tick.
              kubectl logs -n tenant-builds \
                -l "batch.kubernetes.io/job-name=${JOB#job.batch/}" \
                -c ci --tail=40 || true
              exit 0
            fi
            if [ "$failed" = "True" ]; then
              echo "[$(date -u +%H:%M:%S)] $JOB Failed — forensics:"
              kubectl describe -n tenant-builds "$JOB" || true
              # --all-containers: a startupProbe failure on postgres/redis/
              # rabbitmq is reported against the SIDECAR, not against `ci`,
              # and reading only the test container's log makes an
              # infrastructure failure look like a test failure.
              kubectl logs -n tenant-builds \
                -l "batch.kubernetes.io/job-name=${JOB#job.batch/}" \
                --all-containers --tail=200 --prefix=true || true
              exit 1
            fi
            pod_phase=$(kubectl get pods -n tenant-builds \
              -l "batch.kubernetes.io/job-name=${JOB#job.batch/}" \
              -o jsonpath='{.items[0].status.phase}' 2>/dev/null || true)
            echo "[$(date -u +%H:%M:%S)] waiting on $JOB (pod: ${pod_phase:-pending})"
            sleep 30
          done
          echo "[$(date -u +%H:%M:%S)] 25m deadline exceeded"
          kubectl describe -n tenant-builds "$JOB" || true
          exit 1

      # ─── Reap the Job if we are leaving while it still runs ────────────
      # `concurrency.cancel-in-progress: true` is set at the top of this
      # file, so a second push to the same ref kills this workflow mid-wait
      # — and the spawned Job does NOT die with it. It keeps a pod holding
      # ~1.7Gi of memory requests plus 9.25Gi of ephemeral-storage ceilings
      # in tenant-builds until activeDeadlineSeconds (30m) expires. Same
      # applies to the 25m-deadline path above.
      #
      # ONLY reaps a Job that is still ACTIVE. A Job that finished — passed
      # or failed — is left for ttlSecondsAfterFinished (1h) so its pod
      # stays inspectable; the failure path above dumps logs, but a pod you
      # can still `kubectl describe` is worth more than a log tail.
      #
      # `always()` rather than `failure()`: cancellation is the case this
      # exists for, and a cancelled job runs neither `success()` nor
      # `failure()` steps.
      - name: Reap the DB-test Job if still running
        if: always()
        run: |
          set -euo pipefail
          [ -n "${JOB:-}" ] || { echo "no Job was spawned — nothing to reap"; exit 0; }
          active=$(kubectl get -n tenant-builds "$JOB" \
            -o jsonpath='{.status.active}' 2>/dev/null || true)
          if [ "${active:-0}" -gt 0 ] 2>/dev/null; then
            echo "$JOB still active — deleting so it does not outlive this run"
            kubectl delete -n tenant-builds "$JOB" --wait=false || true
          else
            echo "$JOB is not active — leaving it for ttlSecondsAfterFinished"
          fi

  # ─── Build + push the OCI image ────────────────────────────────────────
  # Real OCI builds in this homelab spawn an ephemeral kaniko Job in
  # tenant-builds via `kubectl create -f -` (job-ops and homeview do the
  # same) — never `docker build` on the runner, which has no container
  # engine at all. That absence is deliberate: inline kaniko corrupted
  # /bin/sh on every successful build (divergence entry 38), which is why
  # the k8s-Job pattern exists instead of a buildah-equipped runner image.
  #
  # Separate job, not another step, for two reasons: it must not publish on
  # pull requests (a PR must never publish `:latest`), and it needs its own
  # SSH setup that the test job has no business carrying.
  build-push:
    runs-on: ubuntu-latest
    # Gates on db-tests as well as ci: publishing an image whose database
    # layer is red is precisely the outcome Stage 6 exists to prevent, and
    # judge-arena's deploy is a manual tag bump, so a bad :latest would sit
    # in Harbor looking deployable.
    needs: [ci, db-tests]
    #
    # ── NO JOB-LEVEL `if:` — deliberately, and this is not a loosening ─────
    # It used to read `if: github.event_name == 'push' && github.ref ==
    # 'refs/heads/main'`. Gitea creates a commit status for every job in the
    # workflow when the run is queued, and on a PR it never transitioned this
    # one out of `pending`: `needs` was satisfied, the `if` was false, and the
    # status simply stayed "Blocked by required conditions" forever. Observed
    # on PR #9 — `ci` and `db-tests` both green, overall commit status stuck
    # `pending`, so the PR could never show green.
    #
    # That was cosmetic only while no branch protection required these checks.
    # Turning required status checks on would have deadlocked every merge, and
    # the failure would have looked like a broken pipeline rather than a
    # skipped job that never resolved.
    #
    # So the job now always RUNS and the publish decision moved inside it. On
    # a PR every step below no-ops and the job reports success in seconds,
    # having published nothing.
    #
    # The "never publish from a PR" guarantee did NOT move to the step-level
    # `if:` guards — those only avoid pointless work. It lives in the assert
    # inside `Spawn kaniko build Job`, which is the only step that can publish
    # anything and which re-derives the condition itself. A future edit that
    # drops a step guard therefore cannot leak a publish; it fails loudly.

    steps:
      - name: Decide whether this run publishes
        id: gate
        run: |
          set -euo pipefail
          # `github.ref` is the branch ref on a push event; the event-name
          # check is what keeps a PR *targeting* main from matching it.
          if [ "${{ github.event_name }}" = "push" ] \
             && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "push to refs/heads/main — this run builds and publishes"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} ref=${{ github.ref }}"
            echo "not a push to main — this job will no-op and report success"
          fi

      - name: Setup SSH (homelab-bot) — for both the checkout and the template clone
        if: steps.gate.outputs.publish == 'true'
        env:
          BOT_KEY: ${{ secrets.HOMELAB_BOT_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_KEY:-}" ]; then
            echo "::error::HOMELAB_BOT_SSH_KEY is empty. It is an owner-level Gitea secret;"
            echo "the kaniko Job also needs homelab-bot to be a READ COLLABORATOR on this repo."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$BOT_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519,rsa 10.10.0.211 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Checkout source via SSH
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Not github.event.repository.clone_url — that is this Gitea's HTTP
          # URL, which 401s. The runner holds only HOMELAB_BOT_SSH_KEY.
          git clone --no-checkout ssh://git@10.10.0.211/trij/judge-arena.git .
          git fetch origin "${{ github.sha }}"
          git checkout "${{ github.sha }}"

      - name: Compute tag
        if: steps.gate.outputs.publish == 'true'
        id: tag
        run: |
          set -euo pipefail
          short=$(git rev-parse --short=12 HEAD)
          echo "tag=sha-${short}" >> "$GITHUB_OUTPUT"
          echo "building sha-${short}"

      - name: Clone homelab-setup (for the build-job template)
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          rm -rf /tmp/homelab
          git clone --depth 1 ssh://git@10.10.0.211/trij/homelab.git /tmp/homelab

      - name: Spawn kaniko build Job
        if: steps.gate.outputs.publish == 'true'
        env:
          COMPONENT: judge-arena
          # Dockerfile is at the repo root, so the kaniko context is `.`.
          SUBDIR: .
          TAG: ${{ steps.tag.outputs.tag }}
          REPO_SSH_URL: ssh://git@10.10.0.211/trij/judge-arena.git
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # ── The publish guard, re-derived rather than inherited ──────────
          # This step is the ONLY one in this workflow that can put an image
          # in Harbor, so it does not trust the `if:` above to have kept a PR
          # out. The job-level `if:` was removed so the job always reports a
          # terminal status (see the header on this job); the step guards that
          # replaced it are ordinary conditions a future edit could drop while
          # refactoring, and the cost of dropping THIS one is a PR publishing
          # `:latest`. So assert it here, where it cannot be separated from
          # the action it protects.
          #
          # Hard failure, not a silent skip: reaching this line on anything
          # other than a push to main means a guard above is broken, and that
          # is worth a red run rather than a quiet no-op.
          if [ "${{ github.event_name }}" != "push" ] \
             || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::REFUSING TO PUBLISH — reached the kaniko spawn on"
            echo "event=${{ github.event_name }} ref=${{ github.ref }}, which is"
            echo "not a push to refs/heads/main. A step guard above is broken."
            exit 1
          fi
          job=$(envsubst < /tmp/homelab/templates/gitea-workflows/build-job.yaml.tmpl \
            | kubectl create -n tenant-builds -f - -o name)
          echo "JOB=$job" >> "$GITHUB_ENV"
          echo "spawned $job"

      - name: Wait for the build Job
        if: steps.gate.outputs.publish == 'true'
        run: |
          set -euo pipefail
          # Heartbeat rather than `kubectl wait`. A silent wait longer than
          # Gitea's actions.ZOMBIE_TASK_TIMEOUT (default 10m) gets the task
          # killed server-side while the runner keeps going and the build
          # still succeeds — that accounted for 44 of 45 apparent job-ops
          # build failures between 2026-05-13 and 2026-05-26. Printing every
          # 30s keeps the task alive and shows progress when watching live.
          #
          # 50m cap sits below the template's activeDeadlineSeconds=3600 so a
          # genuinely stuck build hits its OWN deadline and leaves the pod for
          # forensics (ttlSecondsAfterFinished=3600).
          deadline=$(( $(date -u +%s) + 3000 ))
          while [ "$(date -u +%s)" -lt "$deadline" ]; do
            complete=$(kubectl get -n tenant-builds "$JOB" \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)
            failed=$(kubectl get -n tenant-builds "$JOB" \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)
            if [ "$complete" = "True" ]; then
              echo "[$(date -u +%H:%M:%S)] $JOB Complete"
              exit 0
            fi
            if [ "$failed" = "True" ]; then
              echo "[$(date -u +%H:%M:%S)] $JOB Failed — forensics:"
              kubectl describe -n tenant-builds "$JOB" || true
              kubectl logs -n tenant-builds \
                -l "batch.kubernetes.io/job-name=${JOB#job.batch/}" \
                --all-containers --tail=200 --prefix=true || true
              exit 1
            fi
            pod_phase=$(kubectl get pods -n tenant-builds \
              -l "batch.kubernetes.io/job-name=${JOB#job.batch/}" \
              -o jsonpath='{.items[0].status.phase}' 2>/dev/null || true)
            echo "[$(date -u +%H:%M:%S)] waiting on $JOB (pod: ${pod_phase:-pending})"
            sleep 30
          done
          echo "[$(date -u +%H:%M:%S)] 50m deadline exceeded"
          kubectl describe -n tenant-builds "$JOB" || true
          exit 1

      # ─── Assert the registry, not the Job ──────────────────────────────
      # `Complete` on the kaniko Job is one hop away from a tag in Harbor.
      # Ask Harbor. Anonymous GET works because project `homelab` is public;
      # the runner has curl + jq (no skopeo) and its ServiceAccount cannot
      # read secrets, so this needs no credentials. On success it prints
      #
      #   IMAGE_PUBLISHED repo=judge-arena tag=sha-<12> digest=sha256:…
      #
      # which is the line to grep for in the runner pod log — NOT
      # "🏁 Job succeeded", which that log prints even after a server-side
      # cancel (see the file header). This is a cheap sentinel, not the
      # closure of pushed-not-built: a run cancelled by the next push to
      # main never reaches this step, and a commit that was not the head of
      # its push never gets a run. Assert the tag for the SHA you intend to
      # PROMOTE — `scripts/ci/ci-status.sh <sha>` from gharial — before
      # every promote.
      - name: Assert Harbor has ${{ steps.tag.outputs.tag }}
        if: steps.gate.outputs.publish == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          bash scripts/ci/assert-harbor-tag.sh judge-arena "$TAG"

      - name: Report the pushed image
        if: steps.gate.outputs.publish == 'true'
        run: |
          echo "pushed harbor.cluster.asethi.com/homelab/judge-arena:${{ steps.tag.outputs.tag }}"
          echo "pushed harbor.cluster.asethi.com/homelab/judge-arena:latest"
          echo ""
          echo "NOT auto-promoted. job-ops opens a promote PR against homelab here;"
          echo "judge-arena's HelmRelease still pins values.image.tag by hand, so the"
          echo "deploy step is deliberately a human one until that wiring exists."

  # ─── NOT DONE HERE: docker-compose scale validation (Task 16's S4 gate) ──
  # `docker compose up --scale app=2 --scale worker=2` plus an LB smoke check
  # is the right CI proof for the S4 exit gate, and it still cannot run on
  # this runner: no container engine. Task 16 already proved the scale-up
  # works via local podman.
  #
  # Note that the `db-tests` job above does NOT generalise to this. It works
  # because the services are stock images a pod can run as sidecars; a
  # compose scale test needs to BUILD the app image and run N replicas behind
  # nginx, which is a compose-shaped problem, not a sidecar-shaped one. The
  # honest options remain a Docker-mode runner group or a purpose-built
  # multi-replica Job. Tracked, not forgotten — and deliberately not
  # represented as a step that "passes".
