# ─── Judge Arena — Compose Load Balancer (Task 16) ─────────────────────────
#
# Internal round-robin load balancer in front of the scaled `app` service
# (`docker compose up --scale app=2 --scale worker=2`). This is NOT the
# TLS-terminating edge proxy — that's `deploy/nginx.conf` (a standalone,
# certbot-managed config for a bare-metal/VPS front door) or an external
# tunnel/LB placed in front of this whole compose stack. This file is
# deliberately HTTP-only: the compose `nginx` service still publishes
# `443:443` (see docker-compose.yml) as a reserved slot for an operator-
# mounted TLS layer, but nothing in this file listens on it — a demo/CI
# compose stack has to boot cleanly with `docker compose up` out of the
# box, and a `listen 443 ssl` block referencing certificate files that
# don't exist would make nginx fail to start at all.
#
# Round-robin: `server app:3000;` is resolved via Docker Compose's embedded
# DNS at nginx startup. When that name resolves to multiple A records (one
# per `app` replica under `--scale app=N`), nginx expands the `server`
# directive to one upstream peer per address and load-balances across all
# of them with its default algorithm (round-robin — no explicit directive
# needed). Caveat: this resolution happens once, at nginx start/reload —
# scaling `app` up or down after nginx is already running won't be picked
# up until nginx restarts/reloads (no dynamic re-resolve here; out of
# scope for this task's structural-validity bar).

upstream app_upstream {
    server app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Single trusted hop (this proxy sits directly in front of `app`) —
    # matches src/lib/client-ip.ts's getClientIp() contract: with
    # TRUSTED_PROXY=true (set on the app/worker services), it trusts the
    # LEFTMOST X-Forwarded-For entry as the real client IP.
    # $proxy_add_x_forwarded_for appends $remote_addr to whatever XFF the
    # client already sent; since this is the ONLY hop between the client
    # and `app`, a client can prepend fake entries but can never push
    # itself ahead of $remote_addr — the leftmost entry nginx forwards
    # here is always genuinely append-after-client, so getClientIp()'s
    # single-trusted-hop assumption holds.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # ─── Health check (no rate limit / access log noise) ──
    location = /api/health {
        proxy_pass http://app_upstream;
        access_log off;
    }

    # ─── SSE (src/app/api/events/route.ts) — no buffering, long timeouts.
    # A buffered proxy holds the whole response until its buffer fills (or
    # the upstream closes), which silently stalls an SSE stream; the
    # client is meant to stay connected for the life of its session, not
    # one request/response cycle.
    location = /api/events {
        proxy_pass http://app_upstream;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;
    }

    # ─── Static assets ──
    location /_next/static/ {
        proxy_pass http://app_upstream;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Everything else — general API + pages. Read timeout generous:
    # judge/run-launch routes can wait on a DB round trip under load, and
    # LLM calls themselves happen worker-side (off the request path), but
    # give some headroom over the LB hop regardless.
    location / {
        proxy_pass http://app_upstream;
        proxy_read_timeout 120s;
    }
}
