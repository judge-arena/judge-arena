# ─── Judge Arena — GitHub mirror-status CI ─────────────────────────────────
#
# GitHub is a MIRROR of this repo (per the 1b repo-shape decision — Gitea is
# canonical CI, see .gitea/workflows/ci.yml). This workflow is deliberately
# thin: lint + typecheck + unit tests (DB-free) + build, on every push/PR.
# No deploy, no Docker build/push, no DB-backed suites (test:db/
# test:integration need live Postgres/Redis/RabbitMQ — that's Gitea's job,
# with the full pipeline and its own coverage gate). This file's only
# purpose is a fast green/red signal on the mirror; it is not a release
# gate for anything.
#
# GitHub-hosted `ubuntu-latest` runners DO have Docker + Node preinstalled,
# so this one (unlike .gitea/workflows/ci.yml) can safely use the standard
# `actions/*` JS actions — the "no JS actions" constraint is specific to the
# homelab's Gitea runner (host-mode act_runner, no Node.js baked in — see
# the Gitea workflow's header comment), not GitHub's.

name: CI (mirror)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  mirror-check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    # ── Why this guard exists ──────────────────────────────────────────────
    # Gitea Actions discovers workflows in BOTH `.gitea/workflows` AND
    # `.github/workflows`, so pushing to the homelab Gitea
    # (gitea.lab.asethi.com/trij/judge-arena) schedules this file too — where
    # it fails on its very first step with:
    #
    #     actions/checkout@v4  ->  Cannot find: node in PATH
    #
    # The homelab's act_runner image ships no Node, so NO `uses:` JS action can
    # execute there. That is exactly why the real pipeline in
    # `.gitea/workflows/ci.yml` is RAW SHELL ONLY (see its header). This file
    # is the GitHub mirror, where JS actions are fine — it simply must not be
    # scheduled anywhere else.
    #
    # `github.server_url` is the host actually running the workflow: literally
    # 'https://github.com' on GitHub, and the Gitea base URL under Gitea. So
    # this skips cleanly on Gitea with no repo-level Actions configuration and
    # no duplicated checks. Do not "fix" the failure by adding a Node setup
    # step — that would run the mirror's checks a second time on every homelab
    # push, for no benefit.
    if: github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit below needs this — scripts/importer/** and tests/
      # importer/helpers.ts import '@prisma/v1-client' directly, which is
      # generated-only (never checked into git; package.json's
      # `postinstall` only generates the default v2 client). See the Gitea
      # workflow's equivalent step for the full explanation.
      - name: Generate v1 (importer) Prisma client
        run: npm run db:generate:v1

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # DB-free by design — see vitest.config.ts's own comment for why
      # tests/db/**, tests/integration/**, and the importer's *.db.test.ts
      # are excluded here on purpose (they need live Postgres/Redis/
      # RabbitMQ this runner doesn't have; that's Gitea's job).
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: build-time-placeholder-secret-16
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build
