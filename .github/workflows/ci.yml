# ─── Judge Arena — GitHub mirror-status CI ─────────────────────────────────
#
# GitHub is a MIRROR of this repo (per the 1b repo-shape decision — Gitea is
# canonical CI, see .gitea/workflows/ci.yml). This workflow is deliberately
# thin: lint + typecheck + unit tests (DB-free) + build, on every push/PR.
# No deploy, no Docker build/push, no DB-backed suites (test:db/
# test:integration need live Postgres/Redis/RabbitMQ — that's Gitea's job,
# with the full pipeline and its own coverage gate). This file's only
# purpose is a fast green/red signal on the mirror; it is not a release
# gate for anything.
#
# GitHub-hosted `ubuntu-latest` runners DO have Docker + Node preinstalled,
# so this one (unlike .gitea/workflows/ci.yml) can safely use the standard
# `actions/*` JS actions — the "no JS actions" constraint is specific to the
# homelab's Gitea runner (host-mode act_runner, no Node.js baked in — see
# the Gitea workflow's header comment), not GitHub's.

name: CI (mirror)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  mirror-check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # tsc --noEmit below needs this — scripts/importer/** and tests/
      # importer/helpers.ts import '@prisma/v1-client' directly, which is
      # generated-only (never checked into git; package.json's
      # `postinstall` only generates the default v2 client). See the Gitea
      # workflow's equivalent step for the full explanation.
      - name: Generate v1 (importer) Prisma client
        run: npm run db:generate:v1

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # DB-free by design — see vitest.config.ts's own comment for why
      # tests/db/**, tests/integration/**, and the importer's *.db.test.ts
      # are excluded here on purpose (they need live Postgres/Redis/
      # RabbitMQ this runner doesn't have; that's Gitea's job).
      - name: Unit tests
        run: npm test

      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXTAUTH_SECRET: build-time-placeholder-secret-16
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build
