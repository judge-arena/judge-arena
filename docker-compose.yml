# ─── Judge Arena — Production Docker Compose v2 (Task 16) ─────────────────
#
# Scale-safe: `app` and `worker` have no container_name and no static
# host-port publish, so `docker compose up --scale app=2 --scale worker=2`
# is structurally valid — `nginx` round-robins across `app` replicas
# (deploy/nginx-lb.conf); RabbitMQ's consumer prefetch fans work out across
# `worker` replicas on its own (no LB needed on that side).
#
# Services:
#   - migrate:   one-shot `prisma migrate deploy` — the ONLY place migrations run
#   - app:       Next.js web tier (scale-safe, no host port — behind nginx)
#   - worker:    queue consumer (scale-safe; src/worker/main.ts -> worker.js)
#   - nginx:     round-robin LB in front of `app` (deploy/nginx-lb.conf)
#   - postgres:  PostgreSQL 16 (compose-network only — no host port here)
#   - redis:     Redis 7, noeviction (rate limiter / SSE bus / breaker state)
#   - rabbitmq:  RabbitMQ 3.13 management, alpine (judgment-execution / run-create queues)
#
# Usage:
#   cp .env.example .env.production
#   # Edit .env.production with real values — see CONTRIBUTING.md's
#   # "Deployment" section for the Prisma connection-pool budget formula
#   # referenced throughout this file.
#   docker compose up -d                                  # migrate runs once, then app/worker/nginx start
#   docker compose up -d --scale app=2 --scale worker=2    # scaled demo rig (spec's "S4" exit gate)
#
# Optional one-off seed (NOT run automatically): reuses the `migrate`
# service's image (full Prisma + tsx toolchain, unlike the minimal `app`/
# `worker` image) with its command overridden:
#   docker compose run --rm migrate npx tsx prisma/seed.ts

services:
  # ─── One-shot migrations — the ONLY place `prisma migrate deploy` runs.
  # No app/worker replica ever runs migrations itself (that used to be in
  # the image CMD — a BLOCKER: N replicas starting concurrently would all
  # race the migration on boot). Built off the `builder` Dockerfile stage
  # (not `runner`) because that's the stage with the full Prisma CLI +
  # prisma/migrations still present — `runner` deliberately drops both to
  # stay minimal (see Dockerfile's runner-stage comment). Exits 0 on
  # success; app/worker gate their own startup on that exit via
  # `depends_on: migrate: condition: service_completed_successfully`.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: judge-arena-migrate
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    environment:
      - DATABASE_URL=postgresql://judgearena:${POSTGRES_PASSWORD:-changeme}@postgres:5432/judgearena?connection_limit=5&pool_timeout=20
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - judge-arena-net

  # ─── Application (web tier) ──
  # Scale-safe: no container_name, no host-port publish — `docker compose
  # up --scale app=N` requires both (a fixed container_name collides on
  # the 2nd replica; a static `ports:` host-port publish fails to bind
  # twice). `nginx` is the only service that publishes a host port for web
  # traffic; `app` just `expose`s 3000 on the compose network.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      # ─── Prisma connection-pool budget (spec §4) ──
      # connection_limit=10, pool_timeout=20s per app replica. This is a
      # PER-REPLICA cap (Prisma's pool is per-process) — the real budget to
      # watch is the sum across every replica of every service:
      #   (app replicas × 10) + (worker replicas × worker connection_limit)
      #     + migrate's 5 + admin/psql headroom  <  Postgres max_connections
      # Postgres's own default (postgres:16-alpine, unmodified here) is
      # max_connections=100. At the default worker connection_limit=4 (see
      # the `worker` service below), 4 app + 4 worker replicas budgets to
      # 4×10 + 4×4 + 5 + ~10 headroom = 71 < 100 — comfortable up to that
      # scale. Recompute this sum (and bump Postgres's own
      # max_connections, or front it with a pooler — CNPG's built-in
      # pgbouncer in the real k8s deploy) before scaling further.
      # Documented again, in full, in CONTRIBUTING.md's "Deployment"
      # section.
      - DATABASE_URL=postgresql://judgearena:${POSTGRES_PASSWORD:-changeme}@postgres:5432/judgearena?connection_limit=10&pool_timeout=20
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-judgearena}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672
      - NODE_ENV=production
      # nginx is the single trusted hop in front of `app` — see
      # deploy/nginx-lb.conf's X-Forwarded-For comment and
      # src/lib/client-ip.ts's getClientIp().
      - TRUSTED_PROXY=true
    command: ["node", "server.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Worker (queue consumer) ──
  # Same image as `app` (`target: runner`), different command — the
  # worker.js bundle Task 16 adds to the standalone output (see
  # Dockerfile). Scale-safe for the same reasons as `app`: no
  # container_name, no host-port publish (its health probe on
  # WORKER_HEALTH_PORT is compose-internal only, not published).
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # Worker connection_limit sizing: EVALUATION_MODEL_CONCURRENCY_PER_RUN
      # (this codebase's name for the spec's "EVALUATION_MODEL_CONCURRENCY")
      # × 2 — one connection for a judgment's claim update, one headroom
      # slot so the persist-result write doesn't serialize behind another
      # in-flight claim on the same pool. Default
      # EVALUATION_MODEL_CONCURRENCY_PER_RUN=2 (see .env.example) → 4.
      # Override WORKER_DB_POOL_LIMIT below if you raise
      # EVALUATION_MODEL_CONCURRENCY_PER_RUN, and recheck the Σ formula in
      # the `app` service's comment above.
      - DATABASE_URL=postgresql://judgearena:${POSTGRES_PASSWORD:-changeme}@postgres:5432/judgearena?connection_limit=${WORKER_DB_POOL_LIMIT:-4}&pool_timeout=20
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-judgearena}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672
      - NODE_ENV=production
      - WORKER_HEALTH_PORT=9090
    command: ["node", "worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - judge-arena-net
    healthcheck:
      # worker.js's own health server (src/worker/main.ts) — NOT the
      # image's built-in Dockerfile HEALTHCHECK (that one probes
      # :3000/api/health, which doesn't exist in this process).
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # ─── nginx — round-robin LB in front of `app` ──
  # deploy/nginx-lb.conf; see that file's header for why it's HTTP-only and
  # what the reserved (unserved) 443 publish below is for.
  nginx:
    image: nginx:1.27-alpine
    container_name: judge-arena-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── PostgreSQL ──
  # No host port published in this (production) profile — unnecessary
  # attack surface for a service every other consumer already reaches over
  # the compose network by name. See `postgres-v1-scratch` below for the
  # one deliberate exception (a host-side CLI tool needs it).
  postgres:
    image: postgres:16-alpine
    container_name: judge-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: judgearena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: judgearena
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/pg-init-test-db.sh:/docker-entrypoint-initdb.d/pg-init-test-db.sh:ro
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgearena -d judgearena"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL (v1 scratch — importer dev/test only) ──
  # Disposable target for the v1 -> v2 importer (scripts/importer/**) to
  # restore a copy of the legacy Railway v1 dump into, so `import:v1` can
  # read from it via V1_DATABASE_URL without touching production. Not part
  # of the default `docker compose up` — only starts with the `importer`
  # profile: `docker compose --profile importer up -d postgres-v1-scratch`.
  # Host port IS published here (unlike `postgres` above) because
  # `import:v1` runs as a host-side CLI (`npm run import:v1` / `tsx`), not
  # a compose service — it needs a reachable host port, not compose-network
  # DNS.
  postgres-v1-scratch:
    image: postgres:16-alpine
    container_name: judge-arena-postgres-v1-scratch
    restart: unless-stopped
    profiles:
      - importer
    environment:
      POSTGRES_USER: judge_arena
      POSTGRES_PASSWORD: password
      POSTGRES_DB: judge_arena_v1
    ports:
      - "5433:5432"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge_arena -d judge_arena_v1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──
  # No host port published in this (production) profile — same reasoning
  # as `postgres` above.
  redis:
    image: redis:7-alpine
    container_name: judge-arena-redis
    restart: unless-stopped
    # noeviction (not allkeys-lru): rate-limit keys are sorted sets with
    # their own PEXPIRE TTLs, so eviction is unnecessary — and evicting a
    # rate-limit key under memory pressure would silently let a client
    # bypass its limit. noeviction instead rejects writes loudly when
    # maxmemory is hit, matching the podman dev container's flags.
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ──
  # `-alpine` variant (not plain `rabbitmq:3.13-management`) to match the
  # rest of this file's base images. AMQP (5672) is compose-network-only,
  # same lockdown reasoning as postgres/redis above; the management UI
  # (15672) stays published — it's an operator/debugging surface with its
  # own auth, not app attack surface.
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: judge-arena-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-judgearena}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Queue types (quorum for judgment.execute/run.create/judge.dlq; classic
  # +TTL+DLX for the judgment.retry.* holding queues) are declared at the
  # application level via assertTopology() (src/lib/queue/topology.ts), not
  # here — this volume just persists broker state (queues, messages)
  # across restarts.
  rabbitmq_data:
    driver: local

networks:
  judge-arena-net:
    driver: bridge
