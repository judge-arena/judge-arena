# ─── Judge Arena — Production Docker Compose ──────────────────────────────
#
# Services:
#   - app:      Next.js application (Judge Arena)
#   - postgres: PostgreSQL 16 database
#   - redis:    Redis 7 for rate limiting & realtime events
#   - rabbitmq: RabbitMQ 3.13 for the judgment-execution/run-create queues
#
# Usage:
#   cp .env.example .env.production
#   # Edit .env.production with real values
#   docker compose up -d
#
# First run:
#   docker compose exec app npx prisma migrate deploy
#   docker compose exec app npx tsx prisma/seed.ts
#

services:
  # ─── Application ──
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: judge-arena-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.production
    environment:
      - DATABASE_URL=postgresql://judgearena:${POSTGRES_PASSWORD:-changeme}@postgres:5432/judgearena
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-judgearena}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: judge-arena-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: judgearena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: judgearena
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/pg-init-test-db.sh:/docker-entrypoint-initdb.d/pg-init-test-db.sh:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judgearena -d judgearena"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL (v1 scratch — importer dev/test only) ──
  # Disposable target for the v1 -> v2 importer (scripts/importer/**) to
  # restore a copy of the legacy Railway v1 dump into, so `import:v1` can
  # read from it via V1_DATABASE_URL without touching production. Not part
  # of the default `docker compose up` — only starts with the `importer`
  # profile: `docker compose --profile importer up -d postgres-v1-scratch`.
  postgres-v1-scratch:
    image: postgres:16-alpine
    container_name: judge-arena-postgres-v1-scratch
    restart: unless-stopped
    profiles:
      - importer
    environment:
      POSTGRES_USER: judge_arena
      POSTGRES_PASSWORD: password
      POSTGRES_DB: judge_arena_v1
    ports:
      - "5433:5432"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge_arena -d judge_arena_v1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ──
  redis:
    image: redis:7-alpine
    container_name: judge-arena-redis
    restart: unless-stopped
    # noeviction (not allkeys-lru): rate-limit keys are sorted sets with
    # their own PEXPIRE TTLs, so eviction is unnecessary — and evicting a
    # rate-limit key under memory pressure would silently let a client
    # bypass its limit. noeviction instead rejects writes loudly when
    # maxmemory is hit, matching the podman dev container's flags.
    command: redis-server --save 60 1 --loglevel warning --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── RabbitMQ ──
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: judge-arena-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-judgearena}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    networks:
      - judge-arena-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  # Queue types (quorum for judgment.execute/run.create/judge.dlq; classic
  # +TTL+DLX for the judgment.retry.* holding queues) are declared at the
  # application level via assertTopology() (src/lib/queue/topology.ts), not
  # here — this volume just persists broker state (queues, messages)
  # across restarts.
  rabbitmq_data:
    driver: local

networks:
  judge-arena-net:
    driver: bridge
